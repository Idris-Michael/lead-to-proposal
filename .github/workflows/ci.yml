name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (tags can be repointed); Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests (incl. Postgres via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest  # fails under 80% coverage; Docker on the runner backs the Postgres tests
      - name: n8n workflow matches its generator
        run: |
          uv run python n8n/build_workflow.py
          git diff --exit-code n8n/lead-to-proposal.json

  infra:
    name: Terraform (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [azure, aws]
    defaults:
      run:
        working-directory: infra/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact
      - name: Checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12
        with:
          directory: infra/${{ matrix.cloud }}
          framework: terraform
          quiet: true

  security:
    name: Secrets, SAST and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The CLI directly, pinned and checksum-verified. (gitleaks-action scans "first commit's
      # parent..HEAD", which fails on a new repository's first push.)
      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | awk '{print $1"  gitleaks.tar.gz"}' | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --metrics=off --exclude .venv
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stack starts, migrates and processes a lead offline
        run: |
          cp .env.example .env
          sed -i "s/^WEBHOOK_SECRET=.*/WEBHOOK_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^OPERATOR_TOKEN=.*/OPERATOR_TOKEN=$(openssl rand -hex 32)/" .env
          docker compose up -d --build --wait api
          docker compose up -d worker
          set -a; . ./.env; set +a
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request
          body = json.dumps(json.load(open("bench/leads.json"))[0]["lead"]).encode()
          ts = str(int(time.time()))
          sig = "v1=" + hmac.new(os.environ["WEBHOOK_SECRET"].encode(), ts.encode() + b"." + body, hashlib.sha256).hexdigest()
          req = urllib.request.Request("http://127.0.0.1:8080/v1/leads", body,
                                       {"content-type": "application/json", "x-timestamp": ts, "x-signature": sig})
          print(urllib.request.urlopen(req).status)
          PY
          for _ in $(seq 1 30); do
            s=$(curl -sf -H "authorization: Bearer $OPERATOR_TOKEN" http://127.0.0.1:8080/v1/stats)
            echo "$s" | grep -q awaiting_approval && break; sleep 2
          done
          echo "$s"; echo "$s" | grep -q awaiting_approval
          test "$(docker compose exec -T api id -u)" = "10001"
      - if: failure()
        run: docker compose logs --no-color | tail -100

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
